openapi: 3.0.3
info:
  title: Veris Helpdesk API
  version: 1.0.0
  description: Emails are compared case-insensitively everywhere, including OTP and ticket matching.
servers:
  - url: /
paths:
  /api/otp/request:
    post:
      summary: Request a one-time verification code
      operationId: requestOtp
      security: []
      description: >
        Always returns the same success response regardless of whether the
        email has tickets. A code is sent only when the email has at least one
        ticket. Emails are compared case-insensitively. Requests are limited
        to 5 per 5 minutes per IP, independently of code verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "200":
          description: Identical success response for all email addresses.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    enum: ["If this email has tickets, a code was sent."]
                    example: "If this email has tickets, a code was sent."
        "400":
          $ref: "#/components/responses/BadInput"
        "429":
          description: >
            Rate limit exceeded. A resend requested within 60 seconds returns
            OTP_RESEND_WAIT and retryAfterSeconds; a generic rate limit has no code.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/GenericRateLimitError"
                  - $ref: "#/components/schemas/OtpResendWaitError"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/otp/verify:
    post:
      summary: Verify a one-time code and create a client session
      operationId: verifyOtp
      security: []
      description: >
        Codes contain 6 digits, expire after 10 minutes, allow at most 5 wrong
        tries, and may be resent every 60 seconds. Successful verification sets
        the client_session cookie. Verification is limited to 10 requests per
        5 minutes per IP, independently of code requests. The 5-wrong-tries
        limit still applies separately to each code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerify"
      responses:
        "200":
          description: Code verified; sets client_session.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/ClientSessionCookie"
          content:
            application/json:
              schema:
                type: object
                required: [message, email]
                properties:
                  message:
                    type: string
                    enum: [Verified]
                    example: Verified
                  email:
                    type: string
                    format: email
        "400":
          $ref: "#/components/responses/BadInput"
        "401":
          description: >
            The code is wrong or expired. If no active code exists for the
            email, return OTP_EXPIRED (same as an expired code), so the
            response never reveals whether an email has tickets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpVerifyError"
              examples:
                wrongCode:
                  summary: The code is wrong
                  value:
                    error: "That code is not correct."
                    code: OTP_WRONG
                expiredCode:
                  summary: The code expired after 10 minutes
                  value:
                    error: "That code has expired. Please request a new one."
                    code: OTP_EXPIRED
        "429":
          description: >
            Either five wrong tries were used and the user must request a new
            code, or a generic rate limit was exceeded.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OtpLockedError"
                  - $ref: "#/components/schemas/GenericRateLimitError"
              examples:
                locked:
                  summary: Five wrong tries used; request a new code
                  value:
                    error: "Too many wrong tries. Please request a new code."
                    code: OTP_LOCKED
        "500":
          $ref: "#/components/responses/ServerError"
  /api/tickets:
    get:
      summary: List the authenticated client's tickets
      operationId: listMyTickets
      security:
        - clientSession: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TicketStatus"
        - name: q
          in: query
          required: false
          description: Case-insensitive match against subject and ticket_number.
          schema:
            type: string
      responses:
        "200":
          description: Client tickets sorted newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/BadInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/tickets/{ticketNumber}:
    get:
      summary: Get a client ticket and its conversation
      operationId: getMyTicket
      description: >
        Requires the verified owner's client_session. The ticket email is
        compared case-insensitively with the session email. Missing tickets and
        tickets belonging to another email return 404. Invalid ticket numbers
        return 400. `messages[].id`, `attachments[].id`, and
        `attachments[].message_id` are optional during rollout.
      security:
        - clientSession: []
      parameters:
        - $ref: "#/components/parameters/TicketNumber"
      responses:
        "200":
          $ref: "#/components/responses/ClientTicketDetail"
        "400":
          $ref: "#/components/responses/BadInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ClientTicketNotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/tickets/{ticketNumber}/messages:
    post:
      summary: Reply to a ticket as its verified owner
      operationId: createClientTicketMessage
      description: >
        Planned operation. Requires client_session for the verified owner.
        Ticket ownership is checked against the session email case-insensitively.
        The reply quota is 10 requests per five minutes per verified email,
        across tickets and independent of other quotas. After saving the reply,
        create an entry in the admin inbox and email the shared admin mailbox.
        Log inbox or email delivery failures and still return 201 for the saved reply.
      security:
        - clientSession: []
      parameters:
        - $ref: "#/components/parameters/TicketNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientReplyInput"
            example:
              body: The duplicate charge appeared on my November statement.
      responses:
        "201":
          description: Saved client message with an empty attachments array.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/SavedReply"
                      - type: object
                        properties:
                          sender_type:
                            type: string
                            enum: [client]
                          attachments:
                            type: array
                            maxItems: 0
                            items:
                              $ref: "#/components/schemas/ThreadAttachment"
              example:
                data:
                  id: 565fa917-be6e-4ddd-a0c8-def4628aeb6e
                  sender_type: client
                  body: The duplicate charge appeared on my November statement.
                  created_at: '2026-11-26T03:30:00Z'
                  attachments: []
        "400":
          description: Invalid ticket number, invalid JSON or body, or a closed ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidBody:
                  value:
                    error: Reply must contain 1 to 5,000 characters after trimming.
                closedTicket:
                  value:
                    error: Ticket is closed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ClientTicketNotFound"
        "429":
          description: The verified client exceeded the separate reply quota of 10 requests per five minutes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericRateLimitError"
              example:
                error: Too many requests. Please try again later.
        "500":
          $ref: "#/components/responses/ServerError"
  /api/attachments/{attachmentId}:
    get:
      summary: Get a temporary signed download URL for an attachment
      operationId: getAttachmentDownloadUrl
      description: >
        Accessible to authenticated administrators (any ticket attachment) or
        verified clients (only attachments belonging to a ticket matching their
        session email, compared case-insensitively). Attachments belonging to
        another client return 404, never 403.
      security:
        - adminSession: []
        - clientSession: []
      parameters:
        - $ref: "#/components/parameters/AttachmentId"
      responses:
        "200":
          description: Signed download URL and attachment metadata.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AttachmentDownload"
        "400":
          $ref: "#/components/responses/BadInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AttachmentNotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/admin/login:
    post:
      summary: Log in an administrator
      operationId: adminLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLogin"
      responses:
        "200":
          description: Login successful; sets the admin_session cookie.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/AdminSessionCookie"
          content:
            application/json:
              schema:
                type: object
                required: [message, admin]
                properties:
                  message:
                    type: string
                    example: Login successful
                  admin:
                    $ref: "#/components/schemas/Admin"
        "400":
          description: Invalid JSON body or invalid login fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many login attempts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/logout:
    post:
      summary: Log out an administrator
      operationId: adminLogout
      security: []
      description: Always returns 200 and clears admin_session, even if the session is expired or missing.
      responses:
        "200":
          description: Clears the admin_session cookie.
          headers:
            Set-Cookie:
              description: Clears the admin_session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    enum: ["Logged out"]
                    example: Logged out
  /api/admin/tickets:
    get:
      summary: List tickets for administrators
      operationId: adminListTickets
      description: >
        Results are sorted newest first. The q parameter matches subject and
        ticket_number case-insensitively. Status and priority filters can be
        combined. page defaults to 1 and pageSize defaults to 10; pageSize has
        a maximum of 50. Out-of-range values return 400, and an invalid
        priority value returns 400.
      security:
        - adminSession: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TicketStatus"
        - name: priority
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Priority"
        - name: q
          in: query
          required: false
          description: Case-insensitive match against subject and ticket_number.
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Paginated tickets sorted newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data, page, pageSize, total]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Ticket"
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  total:
                    type: integer
        "400":
          description: Invalid filters or out-of-range page/pageSize.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/admin/tickets/{ticketNumber}:
    parameters:
      - $ref: "#/components/parameters/TicketNumber"
    get:
      summary: Get a ticket and its conversation as an administrator
      operationId: adminGetTicket
      description: >
        Requires admin_session and can retrieve any ticket. Returns oldest-first
        messages with IDs and attachment metadata with IDs. An attachment's
        message_id identifies its reply, or is null for an original submission
        file. Invalid ticket numbers return 400.
      security:
        - adminSession: []
      responses:
        "200":
          $ref: "#/components/responses/TicketDetail"
        "400":
          $ref: "#/components/responses/BadInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TicketNotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    patch:
      summary: Update a ticket's status, priority, or service
      operationId: adminUpdateTicket
      description: >
        Requires admin_session. Change the ticket's category through `service`.
        Set `status` to `closed` to close a ticket or to `open` to reopen it.
        For the Request info action, set `status` to `waiting_for_client`.
        Explanatory messages use the separately planned
        `POST /api/admin/tickets/{ticketNumber}/messages`.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketUpdate"
            examples:
              changeService:
                value:
                  service: Billing
              reopen:
                value:
                  status: open
              requestInfo:
                value:
                  status: waiting_for_client
      responses:
        "200":
          description: Ticket updated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Ticket"
              example:
                data:
                  id: b5b927b5-d9ab-4823-aaa9-473aabbe1efe
                  ticket_number: TCK-2026-00001
                  full_name: Alex Reyes
                  email: alex@example.com
                  user_type: subscriber
                  service: Billing
                  subject: Duplicate charge
                  description: My subscription was charged twice.
                  priority: medium
                  status: waiting_for_client
                  consent_given: true
                  created_at: '2026-11-26T03:00:00Z'
                  updated_at: '2026-11-26T03:10:00Z'
        "400":
          description: Invalid ticket number, invalid JSON, or invalid ticket update fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Invalid ticket update
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TicketNotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/admin/tickets/{ticketNumber}/messages:
    post:
      summary: Reply to a ticket as an administrator
      operationId: adminCreateTicketMessage
      description: >
        Planned operation. Requires admin_session. If file storage or attachment
        metadata persistence fails, return 500, roll back the reply, and clean
        up any partially saved attachment data. Email the client only after the
        reply and any attachment are saved. Log email delivery failures and
        still return 201 for the saved reply.
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/TicketNumber"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AdminReplyInput"
            encoding:
              attachment:
                contentType: image/jpeg, image/png, application/pdf
            examples:
              textOnly:
                value:
                  body: Could you confirm the statement date?
              withAttachment:
                value:
                  body: I've attached the refund confirmation.
                  attachment: '<binary PDF>'
      responses:
        "201":
          description: Saved admin message with its attachment, or an empty attachments array.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/SavedReply"
                      - type: object
                        properties:
                          sender_type:
                            type: string
                            enum: [admin]
              example:
                data:
                  id: 17151769-2598-45ec-99f5-141279c288a1
                  sender_type: admin
                  body: I've attached the refund confirmation.
                  created_at: '2026-11-26T04:00:00Z'
                  attachments:
                    - id: 3e2f70f2-be91-4f09-8281-f06d24922e9c
                      message_id: 17151769-2598-45ec-99f5-141279c288a1
                      file_name: refund-confirmation.pdf
                      file_type: application/pdf
                      file_size: 24576
        "400":
          description: Invalid ticket number, invalid multipart body or attachment, or a closed ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidAttachment:
                  value:
                    error: Please upload a JPG, PNG, or PDF file.
                closedTicket:
                  value:
                    error: Ticket is closed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TicketNotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/admin/notifications:
    get:
      summary: List entries in the shared admin inbox
      operationId: adminListNotifications
      description: >
        Planned operation. Requires admin_session. Returns up to 50 entries,
        ordered by created_at newest first. All admins see the same entries
        and read state.
      security:
        - adminSession: []
      responses:
        "200":
          description: Inbox entries, or an empty data array if the inbox is empty.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    maxItems: 50
                    items:
                      $ref: "#/components/schemas/Notification"
              example:
                data:
                  - id: 50165ed7-7cdf-4de9-a64f-9368a30b1238
                    message: Client replied to TCK-2026-00001.
                    is_read: false
                    created_at: '2026-11-26T03:30:01Z'
                    ticket_number: TCK-2026-00001
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/admin/notifications/{notificationId}:
    parameters:
      - $ref: "#/components/parameters/NotificationId"
    patch:
      summary: Mark a notification as read
      operationId: adminMarkNotificationRead
      description: >
        Planned operation. Requires admin_session. Marks the entry as read
        for all admins. Invalid notification IDs or request bodies return 400.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationReadInput"
            example:
              is_read: true
      responses:
        "200":
          description: Updated inbox entry with is_read set to true.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/Notification"
                      - type: object
                        properties:
                          is_read:
                            type: boolean
                            enum: [true]
              example:
                data:
                  id: 50165ed7-7cdf-4de9-a64f-9368a30b1238
                  message: Client replied to TCK-2026-00001.
                  is_read: true
                  created_at: '2026-11-26T03:30:01Z'
                  ticket_number: TCK-2026-00001
        "400":
          $ref: "#/components/responses/BadInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotificationNotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      summary: Delete a notification
      operationId: adminDeleteNotification
      description: >
        Planned operation. Requires admin_session. Removes the entry from the
        shared inbox for all admins. Invalid notification IDs return 400.
      security:
        - adminSession: []
      responses:
        "204":
          description: Notification deleted. The response has no body.
        "400":
          $ref: "#/components/responses/BadInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotificationNotFound"
        "500":
          $ref: "#/components/responses/ServerError"
components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: admin_session
      description: >
        Administrator JWT cookie. Protected admin endpoints require a token
        with an adminId payload. Client tokens with role: client must be rejected.
    clientSession:
      type: apiKey
      in: cookie
      name: client_session
      description: >
        Client JWT cookie; payload is { email, role: "client" }. Admin endpoints
        require an admin token with adminId; client tokens must be rejected.
  headers:
    AdminSessionCookie:
      description: >
        JWT cookie named admin_session; httpOnly, sameSite=lax, max-age 86400
        seconds, path=/, secure in production.
      schema:
        type: string
    ClientSessionCookie:
      description: >
        JWT cookie named client_session; httpOnly, secure in production,
        sameSite=lax, valid for 2 hours.
      schema:
        type: string
  parameters:
    TicketNumber:
      name: ticketNumber
      in: path
      required: true
      schema:
        type: string
        pattern: "^TCK-[0-9]{4}-[0-9]{5}$"
        example: TCK-2026-00001
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        example: 50165ed7-7cdf-4de9-a64f-9368a30b1238
  examples:
    TicketDetail:
      value:
        data:
          id: b5b927b5-d9ab-4823-aaa9-473aabbe1efe
          ticket_number: TCK-2026-00001
          full_name: Alex Reyes
          email: alex@example.com
          user_type: subscriber
          service: Billing
          subject: Duplicate charge
          description: My subscription was charged twice.
          priority: medium
          status: waiting_for_client
          consent_given: true
          created_at: '2026-11-26T03:00:00Z'
          updated_at: '2026-11-26T03:10:00Z'
          messages:
            - id: 565fa917-be6e-4ddd-a0c8-def4628aeb6e
              sender_type: client
              body: The duplicate charge appeared on my November statement.
              created_at: '2026-11-26T03:30:00Z'
            - id: 17151769-2598-45ec-99f5-141279c288a1
              sender_type: admin
              body: I've attached the refund confirmation.
              created_at: '2026-11-26T04:00:00Z'
          attachments:
            - id: cf101adb-d35d-4052-a418-6c359189156a
              message_id: null
              file_name: statement.pdf
              file_type: application/pdf
              file_size: 32768
            - id: 3e2f70f2-be91-4f09-8281-f06d24922e9c
              message_id: 17151769-2598-45ec-99f5-141279c288a1
              file_name: refund-confirmation.pdf
              file_type: application/pdf
              file_size: 24576
  responses:
    BadInput:
      description: Bad input.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid authentication, or access not verified.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ClientTicketDetail:
      description: Ticket with oldest-first messages and attachment metadata. Thread IDs are optional during rollout.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: "#/components/schemas/ClientTicketDetail"
          examples:
            withThreadIds:
              $ref: "#/components/examples/TicketDetail"
    TicketDetail:
      description: Ticket with oldest-first messages and attachment metadata.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: "#/components/schemas/TicketDetail"
          examples:
            withThreadIds:
              $ref: "#/components/examples/TicketDetail"
    TicketNotFound:
      description: Ticket not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TicketNotFoundError"
    ClientTicketNotFound:
      description: Ticket not found, including when it belongs to a different email.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TicketNotFoundError"
    NotificationNotFound:
      description: Notification not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Notification not found
    AttachmentNotFound:
      description: Attachment not found, including when it belongs to a different email.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AttachmentNotFoundError"
    ServerError:
      description: Server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
    GenericRateLimitError:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
    OtpResendWaitError:
      type: object
      required: [error, code, retryAfterSeconds]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [OTP_RESEND_WAIT]
        retryAfterSeconds:
          type: integer
    OtpVerifyError:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [OTP_WRONG, OTP_EXPIRED]
          example: OTP_WRONG
    OtpLockedError:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [OTP_LOCKED]
          example: OTP_LOCKED
    TicketNotFoundError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: ["Ticket not found"]
          example: Ticket not found
    AttachmentNotFoundError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: ["Attachment not found"]
          example: Attachment not found
    OtpRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    OtpVerify:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: "^[0-9]{6}$"
          minLength: 6
          maxLength: 6
    AdminLogin:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    Admin:
      type: object
      required: [id, email, full_name]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
    TicketStatus:
      type: string
      enum:
        - new
        - open
        - in_progress
        - waiting_for_client
        - resolved
        - closed
    Priority:
      type: string
      enum:
        - low
        - medium
        - high
        - urgent
    UserType:
      type: string
      enum:
        - subscriber
        - student
    Ticket:
      type: object
      required:
        - id
        - ticket_number
        - full_name
        - email
        - user_type
        - service
        - subject
        - description
        - priority
        - status
        - consent_given
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        ticket_number:
          type: string
          pattern: "^TCK-[0-9]{4}-[0-9]{5}$"
          example: TCK-2026-00001
        full_name:
          type: string
        email:
          type: string
          format: email
        user_type:
          $ref: "#/components/schemas/UserType"
        service:
          type: string
        subject:
          type: string
        description:
          type: string
        priority:
          $ref: "#/components/schemas/Priority"
        status:
          $ref: "#/components/schemas/TicketStatus"
        consent_given:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ClientTicketDetail:
      allOf:
        - $ref: "#/components/schemas/Ticket"
        - type: object
          required: [messages, attachments]
          properties:
            messages:
              type: array
              description: Messages sorted by created_at oldest first. Empty when there are no replies.
              items:
                $ref: "#/components/schemas/ClientThreadMessage"
            attachments:
              type: array
              description: Original submission and reply files. Empty when there are no files.
              items:
                $ref: "#/components/schemas/ClientThreadAttachment"
    TicketDetail:
      allOf:
        - $ref: "#/components/schemas/ClientTicketDetail"
        - type: object
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/Message"
            attachments:
              type: array
              items:
                $ref: "#/components/schemas/ThreadAttachment"
    ClientThreadMessage:
      type: object
      required: [sender_type, body, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: Matches message_id on attached files.
        sender_type:
          type: string
          enum: [client, admin]
        body:
          type: string
        created_at:
          type: string
          format: date-time
    Message:
      allOf:
        - $ref: "#/components/schemas/ClientThreadMessage"
        - type: object
          required: [id]
    Attachment:
      type: object
      required: [file_name, file_type, file_size]
      properties:
        file_name:
          type: string
        file_type:
          type: string
        file_size:
          type: integer
    ClientThreadAttachment:
      allOf:
        - $ref: "#/components/schemas/Attachment"
        - type: object
          properties:
            id:
              type: string
              format: uuid
              description: Pass this value to `GET /api/attachments/{attachmentId}` for a signed download URL.
            message_id:
              type: string
              format: uuid
              nullable: true
              description: >
                Identifies the reply that owns the file. Null identifies an
                original submission file.
    ThreadAttachment:
      allOf:
        - $ref: "#/components/schemas/ClientThreadAttachment"
        - type: object
          required: [id, message_id]
    AttachmentDownload:
      allOf:
        - $ref: "#/components/schemas/Attachment"
        - type: object
          required: [id, url]
          properties:
            id:
              type: string
              format: uuid
            url:
              type: string
              format: uri
    TicketUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/TicketStatus"
        priority:
          $ref: "#/components/schemas/Priority"
        service:
          type: string
          enum: [Billing, Technical Support, General Inquiry]
          description: Updates the ticket's category using its existing service field.
    ReplyBody:
      type: string
      description: >
        Trim leading and trailing whitespace before validating and saving.
        The trimmed body must contain 1 to 5,000 characters.
      pattern: '^\s*\S(?:[\s\S]{0,4998}\S)?\s*$'
    ClientReplyInput:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body:
          $ref: "#/components/schemas/ReplyBody"
    AdminReplyInput:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body:
          $ref: "#/components/schemas/ReplyBody"
        attachment:
          type: string
          format: binary
          description: >
            One optional non-empty JPG, PNG, or PDF, at most 10 MB (10,485,760 bytes).
            The file signature must match the declared MIME type.
    SavedReply:
      allOf:
        - $ref: "#/components/schemas/Message"
        - type: object
          required: [attachments]
          properties:
            attachments:
              type: array
              maxItems: 1
              description: Saved attachments for this reply. Each message_id equals the saved message's id.
              items:
                allOf:
                  - $ref: "#/components/schemas/ThreadAttachment"
                  - type: object
                    properties:
                      message_id:
                        type: string
    Notification:
      type: object
      description: Planned shared admin inbox entry.
      required: [id, message, is_read, created_at, ticket_number]
      properties:
        id:
          type: string
          format: uuid
        message:
          type: string
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time
        ticket_number:
          type: string
          pattern: "^TCK-[0-9]{4}-[0-9]{5}$"
          nullable: true
          description: Linked ticket number. Null when the entry has no linked ticket.
    NotificationReadInput:
      type: object
      required: [is_read]
      additionalProperties: false
      properties:
        is_read:
          type: boolean
          enum: [true]
